name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      make_prerelease:
        description: 'Publish the debug APK as a GitHub pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FieldNotes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish debug APK as pre-release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.make_prerelease == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="debug-$(date +'%Y%m%d')-${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
            --prerelease \
            --title "Field Notes $TAG (debug)" \
            --notes "Debug build of commit ${GITHUB_SHA::7}. Pre-release — may contain bugs." \
            --target "$GITHUB_SHA"

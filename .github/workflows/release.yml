name: Release APK

# Manually triggered signed-release build. Decodes the signing keystore from
# secrets when present; without secrets the APK is debug-signed so the run
# still produces an installable APK. The APK is attached to a GitHub Release
# (release assets do not count against Actions artifact storage).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag for the release (e.g. v1.4.1-release)'
        required: true
        default: 'v1.4.1-release'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Keystore decoded — APK will be signed with the release key."
          else
            echo "ANDROID_KEYSTORE_BASE64 is not set — falling back to debug signing."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          gh release create "$TAG" app/build/outputs/apk/release/*.apk \
            --prerelease \
            --title "Field Notes $TAG (release)" \
            --notes "Release build of commit ${GITHUB_SHA::7}. Signed with the release key when ANDROID_KEYSTORE_* secrets are configured; debug-signed otherwise." \
            --target "$GITHUB_SHA" \
            || gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber
